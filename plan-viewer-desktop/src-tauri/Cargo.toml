[package]
name = "plan-viewer-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "6"
notify-debouncer-mini = "0.4"
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

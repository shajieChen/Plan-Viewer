[package]
name = "plan-viewer-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "6"
notify-debouncer-mini = "0.4"
chrono = "0.4"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Graphics_Dwm"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
